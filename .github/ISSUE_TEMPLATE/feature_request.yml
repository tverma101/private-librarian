name: Feature request
description: Propose a focused improvement to Private Librarian
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Private Librarian keeps analysis read-only and organization virtual by default. Real Finder changes exist only behind the explicit, reviewed, journaled Apply/Undo workflow. Normal indexing/inference stays local/offline; outbound networking is reserved for explicit model provisioning and ordinary system-browser links.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the user pain, not just the implementation you want.
      placeholder: It is hard to find...
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What should the app do?
      description: Describe the desired behavior in plain English.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: A small synthetic example is useful if the feature depends on file layout or content.

  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches considered
      description: Optional. Mention a simpler solution if one exists.

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: Analysis can remain read-only; any Finder mutation can stay inside the explicit Apply/Undo boundary rather than becoming automatic.
          required: true
        - label: Normal indexing/inference can remain offline; any network use can stay limited to explicit model provisioning or a system-browser action, with no telemetry, cloud inference, or listener.
          required: true
        - label: Any example data in this issue is synthetic or sanitized.
          required: true
