name: One-shot So400m Apple-silicon smoke

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended
    paths:
      - .github/workflows/one-shot-so400m-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated benchmark paths
        run: |
          {
            echo "LIBRARIAN_APP_SUPPORT_DIR=$RUNNER_TEMP/private-librarian-so400m"
            echo "LIBRARIAN_MODELS_DIR=$RUNNER_TEMP/private-librarian-so400m/Models"
            echo "LIBRARIAN_SPECIALIST_MODELS_DIR=$RUNNER_TEMP/private-librarian-so400m/Models/specialists"
            echo "LIBRARIAN_MODEL_RUNTIME_DIR=$RUNNER_TEMP/private-librarian-so400m/model-runtime"
          } >> "$GITHUB_ENV"

      - name: Record runner hardware
        run: |
          set -euxo pipefail
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.memsize || true
          sw_vers

      - name: Provision only SigLIP2 So400m and specialist runtime
        run: |
          set -euxo pipefail
          ./scripts/setup_models.sh --specialist-model siglip2-so400m-naflex \
            --specialists-dir "$LIBRARIAN_SPECIALIST_MODELS_DIR" \
            --runtime-dir "$LIBRARIAN_MODEL_RUNTIME_DIR"

      - name: Run hardened So400m benchmark
        run: |
          set -euxo pipefail
          "$LIBRARIAN_MODEL_RUNTIME_DIR/bin/python3" scripts/benchmark_specialist.py \
            --profile quality \
            --models-dir "$LIBRARIAN_SPECIALIST_MODELS_DIR" \
            --samples 5 \
            --batch-sizes 1,2,4 \
            --timeout 300 \
            --output "$RUNNER_TEMP/siglip-so400m-benchmark.json"
          cat "$RUNNER_TEMP/siglip-so400m-benchmark.json"

      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: siglip-so400m-apple-silicon-smoke
          path: ${{ runner.temp }}/siglip-so400m-benchmark.json
          if-no-files-found: error
