name: Smart groups integration verify

on:
  push:
    branches: [fix/tier2-incremental-ci]
    paths:
      - scripts/apply_smart_groups_ui.py
      - Tests/LibrarianTests/SmartOrganizationTests.swift
      - Tests/LibrarianTests/VisionImageTests.swift
      - .github/workflows/smart-groups-verify.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor == 'tverma101'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tier2-incremental-ci
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Apply exact smart-groups patch
        run: python3 scripts/apply_smart_groups_ui.py

      - name: Check formatting
        run: git diff --check

      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Strict concurrency warnings are errors
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Full test suite
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Smart organization regression tests
        run: swift test --filter SmartOrganizationTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Release E2E
        run: |
          swift build -c release
          bash scripts/e2e_local.sh .build/release/librarian-cli
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Package and audit sandbox
        run: |
          scripts/package_app.sh .build/release
          python3 scripts/audit_entitlements.py dist/PrivateLibrarian.app --expect-hardened
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Commit verified UI integration
        run: |
          git add Sources/LibrarianCore/SmartOrganization.swift \
                  Sources/LibrarianApp/PrivateLibrarianApp.swift \
                  Sources/LibrarianApp/MagicViews.swift
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: surface bounded smart groups in the app"
          git push origin HEAD:fix/tier2-incremental-ci
