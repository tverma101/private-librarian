name: Finish semantic text judge

on:
  push:
    branches:
      - A3
    paths:
      - ".github/workflows/finish-semantic-text-judge.yml"

jobs:
  finish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: A3
          fetch-depth: 0
      - name: Patch and contract-test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finish_semantic_text_judge.py
          python3 -m py_compile scripts/specialist.py scripts/test_specialist_contract.py
          python3 scripts/test_specialist_contract.py
      - name: Commit final source-only wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-semantic-text-judge.yml scripts/finish_semantic_text_judge.py
          git add Sources/LibrarianCore/LocalModels/LocalModelRouter.swift \
                  Sources/LibrarianCore/LocalModels/SpecialistModelBridge.swift \
                  Sources/LibrarianCore/Indexing/Indexer.swift \
                  Tests/LibrarianTests/LocalModelRouterTests.swift \
                  scripts/specialist.py scripts/test_specialist_contract.py
          git commit -m "Enable bounded LFM text semantic judge"
          git push origin HEAD:A3
