name: One-shot profile validation

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build debug
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Build Swift 6
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Full Swift tests
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Specialist and setup contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup_models.sh
          bash scripts/test_setup_cancellation.sh
          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py scripts/provision_image_models.py
          python3 scripts/test_specialist_contract.py
          python3 scripts/specialist.py --syntax-check | tee specialist-contract.json
          grep -q 'profile-exclusive-base-or-so400m' specialist-contract.json
          python3 scripts/provision_specialist_models.py --list >/dev/null
      - name: Golden Library quality
        run: python3 -B scripts/benchmark_quality.py --output quality-result.json
