name: Wire semantic context

on:
  push:
    branches:
      - A3
    paths:
      - ".github/workflows/wire-semantic-context.yml"
  workflow_dispatch:

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: A3
          fetch-depth: 0
      - name: Patch integration points
        run: python3 scripts/wire_semantic_context.py
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/LibrarianCore/Organization/SmartOrganization.swift Sources/LibrarianCore/Indexing/Indexer.swift Sources/LibrarianCore/LocalModels/SpecialistModelBridge.swift scripts/specialist.py
          git commit -m "Make specialist routing content and context aware"
          git push origin HEAD:A3
