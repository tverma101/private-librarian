name: Maintainer final fix

on:
  push:
    branches: [fix/tier2-incremental-ci]
    paths:
      - scripts/apply_final_release_fix.py
      - scripts/fix_final_release_patch_typing.py
      - .github/workflows/maintainer-final-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor == 'tverma101'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tier2-incremental-ci
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Apply exact-match patch
        run: |
          python3 scripts/apply_final_release_fix.py
          python3 scripts/fix_final_release_patch_typing.py

      - name: Check patch formatting
        run: git diff --check

      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Swift 6 language check
        run: swift build -Xswiftc -swift-version -Xswiftc 6
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Full test suite
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: ASR regression tests
        run: swift test --filter ASRStateRegressionTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Release E2E
        run: |
          swift build -c release
          bash scripts/e2e_local.sh .build/release/librarian-cli
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Package and audit sandbox
        run: |
          scripts/package_app.sh .build/release
          python3 scripts/audit_entitlements.py dist/PrivateLibrarian.app --expect-hardened
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Commit verified source patch
        run: |
          git add Sources/LibrarianCore/Indexer.swift \
                  Sources/LibrarianApp/PrivateLibrarianApp.swift \
                  Sources/LibrarianApp/MagicViews.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finish sandbox and local transcription integration"
          git push origin HEAD:fix/tier2-incremental-ci
