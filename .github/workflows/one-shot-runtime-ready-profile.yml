name: One-shot runtime-ready profile repair

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended
    paths:
      - .github/workflows/one-shot-runtime-ready-profile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-does-not-work-as-intended

      - name: Require runtime-ready specialists in UI readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_root = Path("Sources/LibrarianApp")
          changed = 0
          for path in app_root.rglob("*.swift"):
              text = path.read_text()
              if "specialistProvisionedIDs" in text:
                  text = text.replace("specialistProvisionedIDs", "specialistReadyIDs")
                  path.write_text(text)
                  changed += 1
          if changed < 3:
              raise SystemExit(f"expected specialist readiness references in at least 3 app files, changed {changed}")

          entry = Path("Sources/LibrarianApp/Library/AppEntryPoint.swift")
          text = entry.read_text()
          old = "            self.specialistReadyIDs = readiness.specialistIDs\n"
          new = "            // A downloaded checkpoint is not enough: the selected profile is\n            // Ready only when its actual offline runtime preflight succeeds.\n            self.specialistReadyIDs = readiness.specialistRuntimeIDs\n"
          if old not in text:
              raise SystemExit("runtime-ready assignment marker missing")
          entry.write_text(text.replace(old, new, 1))

          settings = Path("Sources/LibrarianApp/App/SimpleSettingsView.swift")
          text = settings.read_text()
          text = text.replace(
              "        let provisioned = model.specialistReadyIDs.contains(descriptor.id)\n",
              "        let ready = model.specialistReadyIDs.contains(descriptor.id)\n")
          text = text.replace(
              "            Image(systemName: provisioned ? \"checkmark.circle.fill\" : \"circle\")\n                .foregroundStyle(provisioned ? .green : .secondary)\n",
              "            Image(systemName: ready ? \"checkmark.circle.fill\" : \"circle\")\n                .foregroundStyle(ready ? .green : .secondary)\n")
          text = text.replace(
              "                Text(modelStatusText(descriptor, provisioned: provisioned))\n",
              "                Text(modelStatusText(descriptor, ready: ready))\n")
          text = text.replace(
              "    private func modelStatusText(_ descriptor: LocalModelDescriptor, provisioned: Bool) -> String {\n",
              "    private func modelStatusText(_ descriptor: LocalModelDescriptor, ready: Bool) -> String {\n")
          text = text.replace(
              "        if provisioned { return \"Installed\" }\n",
              "        if ready { return \"Ready\" }\n")
          text = text.replace(
              "        return \"Not installed\"\n",
              "        return \"Needs setup\"\n")
          settings.write_text(text)
          PY

      - name: Guard runtime-ready semantics
        run: |
          grep -F 'self.specialistReadyIDs = readiness.specialistRuntimeIDs' Sources/LibrarianApp/Library/AppEntryPoint.swift
          grep -F 'required.allSatisfy(specialistReadyIDs.contains)' Sources/LibrarianApp/Library/LibrarianModel+ModelReadiness.swift
          ! grep -R -F 'specialistProvisionedIDs' Sources/LibrarianApp
          grep -F 'if ready { return "Ready" }' Sources/LibrarianApp/App/SimpleSettingsView.swift

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LibrarianApp
          git diff --cached --quiet && exit 0
          git commit -m 'Require runtime-ready local AI profiles'
          git push origin HEAD:fix/app-does-not-work-as-intended
