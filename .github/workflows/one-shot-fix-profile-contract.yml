name: One-shot quality profile contract repair

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended
    paths:
      - .github/workflows/one-shot-fix-profile-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-does-not-work-as-intended

      - name: Make quality profile the single local-AI switch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"replacement marker missing: {label}")
              return text.replace(old, new, 1)

          app = Path("Sources/LibrarianApp/Library/AppEntryPoint.swift")
          text = app.read_text()
          text = replace_once(text,
              "/// no listening socket. Sources are added via the system folder picker with\n/// read-only security-scoped bookmarks; the catalog is SQLCipher-encrypted\n",
              "/// no listening socket. Sources are added via the system folder picker with\n/// security-scoped bookmarks; the catalog is SQLCipher-encrypted\n",
              "top bookmark wording")
          text = replace_once(text,
              "    @Published var localModelProfile: LocalModelProfile {\n        didSet {\n            UserDefaults.standard.set(localModelProfile.rawValue, forKey: \"local-model-profile-v1\")\n            restartLiveCoordinator()\n            refreshDashboard()\n        }\n    }\n",
              "    @Published var localModelProfile: LocalModelProfile {\n        didSet {\n            UserDefaults.standard.set(localModelProfile.rawValue, forKey: \"local-model-profile-v1\")\n            // Quality is the consumer-facing source of truth. Fast means the\n            // zero-download path; Balanced/Quality mean their downloaded local\n            // stack is actually enabled. Do not let an old hidden Tier-2 toggle\n            // silently make the selected quality level lie to the user.\n            let shouldEnable = localModelProfile != .fast\n            if localEmbeddingsEnabled != shouldEnable {\n                localEmbeddingsEnabled = shouldEnable\n            } else {\n                restartLiveCoordinator()\n                refreshDashboard()\n            }\n        }\n    }\n",
              "profile didSet")
          text = replace_once(text,
              "        self.localEmbeddingsEnabled = UserDefaults.standard.bool(forKey: \"tier2-enabled-v1\")\n        self.localModelProfile = LocalModelProfile(\n            rawValue: UserDefaults.standard.string(forKey: \"local-model-profile-v1\") ?? \"fast\") ?? .fast\n",
              "        let storedProfile = LocalModelProfile(\n            rawValue: UserDefaults.standard.string(forKey: \"local-model-profile-v1\") ?? \"fast\") ?? .fast\n        // Migrate older builds that persisted an independent Tier-2 toggle.\n        // The visible quality choice now owns this behavior deterministically.\n        self.localEmbeddingsEnabled = storedProfile != .fast\n        self.localModelProfile = storedProfile\n        UserDefaults.standard.set(storedProfile != .fast, forKey: \"tier2-enabled-v1\")\n",
              "profile init migration")
          text = replace_once(text,
              "    // MARK: - Read-only source access via security-scoped bookmarks\n",
              "    // MARK: - Security-scoped source access\n",
              "bookmark section wording")
          text = replace_once(text,
              "                    self.log(\"could not persist read-only bookmark: \\(url.path)\")\n",
              "                    self.log(\"could not persist folder permission: \\(url.path)\")\n",
              "bookmark error wording")
          text = replace_once(text,
              "        panel.allowsMultipleSelection = false\n            panel.message = \"Choose the replacement folder. Indexing stays read-only; files move only when you apply a plan.\"\n",
              "        panel.allowsMultipleSelection = false\n        panel.message = \"Choose the replacement folder. Analysis reads only; files move only when you apply a plan.\"\n",
              "reauthorize copy")
          text = replace_once(text,
              "    /// Resolve a stored read-only security-scoped bookmark and run `body`\n",
              "    /// Resolve a stored security-scoped bookmark and run `body`\n",
              "bookmark resolver wording")
          app.write_text(text)

          settings = Path("Sources/LibrarianApp/App/SimpleSettingsView.swift")
          text = settings.read_text()
          text = replace_once(text,
              "                        Toggle(\"Use downloaded local embeddings\", isOn: $model.localEmbeddingsEnabled)\n",
              "                        Label(\n                            model.localModelProfile == .fast\n                                ? \"Downloaded local AI is off in Fast mode\"\n                                : \"Downloaded local AI follows the selected quality level\",\n                            systemImage: model.localModelProfile == .fast ? \"bolt\" : \"checkmark.circle\")\n                            .font(.caption)\n                            .foregroundStyle(.secondary)\n",
              "advanced embeddings toggle")
          settings.write_text(text)

          home = Path("Sources/LibrarianApp/Library/CleanerHomeView.swift")
          text = home.read_text()
          text = replace_once(text,
              "        case .balanced:\n            return \"Balanced uses downloaded local models when available and keeps uncertain files for review.\"\n        case .quality:\n            return \"Quality uses the full downloaded local stack for harder images and documents.\"\n",
              "        case .balanced:\n            return \"Balanced uses SigLIP2 Base and local fallbacks, then keeps uncertain files for review.\"\n        case .quality:\n            return \"Quality uses SigLIP2 So400m and the stronger local fallback stack for harder images and documents.\"\n",
              "home profile descriptions")
          home.write_text(text)
          PY

      - name: Guard the repaired contract
        run: |
          grep -F 'let shouldEnable = localModelProfile != .fast' Sources/LibrarianApp/Library/AppEntryPoint.swift
          grep -F 'self.localEmbeddingsEnabled = storedProfile != .fast' Sources/LibrarianApp/Library/AppEntryPoint.swift
          ! grep -F 'Toggle("Use downloaded local embeddings"' Sources/LibrarianApp/App/SimpleSettingsView.swift
          grep -F 'Downloaded local AI follows the selected quality level' Sources/LibrarianApp/App/SimpleSettingsView.swift

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LibrarianApp/Library/AppEntryPoint.swift \
                  Sources/LibrarianApp/App/SimpleSettingsView.swift \
                  Sources/LibrarianApp/Library/CleanerHomeView.swift
          git diff --cached --quiet && exit 0
          git commit -m 'Make quality profile control local AI'
          git push origin HEAD:fix/app-does-not-work-as-intended
