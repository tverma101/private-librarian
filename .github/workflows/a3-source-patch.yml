name: A3 Source Patch

on:
  push:
    branches: [A3]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AppKit restoration helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/LibrarianApp/Library/AppEntryPoint.swift')
          text = path.read_text()
          replacements = {
              '    private func removeRestoredLibraryWindows() {': '    @MainActor\n    private func removeRestoredLibraryWindows() {',
              '    fileprivate static func isLibraryWindow(_ window: NSWindow) -> Bool {': '    @MainActor\n    fileprivate static func isLibraryWindow(_ window: NSWindow) -> Bool {',
              '    fileprivate static func disableRestoration(for window: NSWindow) {': '    @MainActor\n    fileprivate static func disableRestoration(for window: NSWindow) {',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- Sources/LibrarianApp/Library/AppEntryPoint.swift
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Sources/LibrarianApp/Library/AppEntryPoint.swift; then
            echo 'Nothing to patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LibrarianApp/Library/AppEntryPoint.swift
          git commit -m 'Fix AppKit actor isolation in restoration helpers'
          git push origin HEAD:A3
