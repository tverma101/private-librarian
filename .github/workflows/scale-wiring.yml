name: Scale wiring verifier

on:
  push:
    branches: [fix/tier2-incremental-ci]

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'wire scalable cleanup into production') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tier2-incremental-ci
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Apply exact patch
        run: python3 scripts/apply_scale_wiring.py
      - name: Check diff
        id: diff
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: swift build
      - name: Swift 6
        if: steps.diff.outputs.changed == 'true'
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: swift test
      - name: Commit verified wiring
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Tejas Verma"
          git config user.email "145865683+tverma101@users.noreply.github.com"
          git add Sources/LibrarianApp/PrivateLibrarianApp.swift \
                  Sources/LibrarianApp/MagicViews.swift \
                  Sources/LibrarianCore/LiveIndexCoordinator.swift \
                  Sources/librarian-cli/main.swift
          git commit -m "feat: wire scalable cleanup into production"
          git push origin HEAD:fix/tier2-incremental-ci
