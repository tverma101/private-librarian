name: Taxonomy upgrade verify

on:
  push:
    branches: [fix/tier2-incremental-ci]
    paths:
      - scripts/apply_taxonomy_upgrade.py
      - Tests/LibrarianTests/SmartOrganizationTests.swift
      - Sources/LibrarianCore/SmartOrganization.swift
      - Sources/LibrarianCore/ChangeDetection.swift
      - .github/workflows/taxonomy-upgrade-verify.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor == 'tverma101'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tier2-incremental-ci
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Apply exact Indexer cleanup hook
        run: python3 scripts/apply_taxonomy_upgrade.py
      - name: Check formatting
        run: git diff --check
      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Strict concurrency warnings are errors
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Full test suite
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Smart organization upgrade tests
        run: swift test --filter SmartOrganizationTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Release E2E
        run: |
          swift build -c release
          bash scripts/e2e_local.sh .build/release/librarian-cli
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Package and audit sandbox
        run: |
          scripts/package_app.sh .build/release
          python3 scripts/audit_entitlements.py dist/PrivateLibrarian.app --expect-hardened
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      - name: Commit verified cleanup hook
        run: |
          git add Sources/LibrarianCore/Indexer.swift
          if git diff --cached --quiet; then
            echo "No Indexer change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: prune retired taxonomy after reindex"
          git push origin HEAD:fix/tier2-incremental-ci
