name: Specialist router verifier

on:
  push:
    branches:
      - feat/final-local-model-router

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-local-model-router
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Apply exact integration patch once
        run: |
          if grep -q 'public var localModelProfile: LocalModelProfile = .fast' Sources/LibrarianCore/Indexer.swift; then
            echo 'integration already applied'
          else
            python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_specialist_router_integration.py')
          text = path.read_text()
          old = r'textContent = nativeText + "\n" + recovered'
          new = r'textContent = nativeText + "\\n" + recovered'
          if old not in text:
              raise SystemExit('expected OCR newline patch source not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'nativeText.contains(recovered.prefix(256))',
              'nativeText.contains(String(recovered.prefix(256)))',
              1,
          )
          path.write_text(text)
          PY
            python3 scripts/apply_specialist_router_integration.py
          fi

      - name: Validate diff
        run: git diff --check

      - name: Python specialist contract
        run: |
          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py
          python3 scripts/specialist.py --syntax-check
          python3 scripts/provision_specialist_models.py --list >/dev/null

      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Swift 6
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Full tests
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Package and entitlement audit
        run: |
          DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer swift build -c release
          scripts/e2e_local.sh .build/release/librarian-cli
          scripts/package_app.sh .build/release
          python3 scripts/audit_entitlements.py dist/PrivateLibrarian.app --expect-hardened

      - name: Commit verified integration if needed
        run: |
          git add Sources/LibrarianCore/Indexer.swift Sources/LibrarianApp/PrivateLibrarianApp.swift Sources/LibrarianApp/MagicViews.swift .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'no production patch to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: wire specialist models into cleanup"
          git push origin HEAD:feat/final-local-model-router
