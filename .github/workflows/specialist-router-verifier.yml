name: Specialist router verifier

on:
  push:
    branches: [feat/final-local-model-router]

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: contains(github.event.head_commit.message, 'ci: verify specialist router integration')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-local-model-router
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Apply exact integration patch
        run: python3 scripts/apply_specialist_router_integration.py

      - name: Validate diff
        run: git diff --check

      - name: Python specialist contract
        run: |
          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py
          python3 scripts/specialist.py --syntax-check
          python3 scripts/provision_specialist_models.py --list >/dev/null

      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Swift 6
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Full tests
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Package and entitlement audit
        run: |
          DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer swift build -c release
          scripts/e2e_local.sh .build/release/librarian-cli
          scripts/package_app.sh .build/release
          python3 scripts/audit_entitlements.py dist/PrivateLibrarian.app --expect-hardened

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/LibrarianCore/Indexer.swift Sources/LibrarianApp/PrivateLibrarianApp.swift Sources/LibrarianApp/MagicViews.swift .github/workflows/ci.yml
          git commit -m "feat: wire specialist models into cleanup"
          git push origin HEAD:feat/final-local-model-router
