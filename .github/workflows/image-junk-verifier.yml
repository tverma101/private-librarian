name: Image junk verifier

on:
  push:
    branches:
      - feat/simple-cleaner-ui

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-cleaner-ui
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Apply exact junk integration once
        run: |
          if grep -q 'image-junk:' Sources/LibrarianCore/Indexer.swift; then
            echo 'image junk integration already applied'
          else
            python3 scripts/apply_image_junk_integration.py
          fi
          python3 scripts/tune_image_junk.py

      - name: Validate diff
        run: git diff --check

      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Swift 6
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Image junk tests
        run: swift test --filter ImageJunkScorerTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Full tests
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Package and entitlement audit
        run: |
          DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer swift build -c release
          scripts/e2e_local.sh .build/release/librarian-cli
          LIBRARIAN_BUILD_SYSTEM=swiftpm scripts/package_app.sh .build/release --no-dmg
          python3 scripts/audit_entitlements.py .build/package-stage/PrivateLibrarian.app --expect-hardened

      - name: Commit verified production integration if needed
        run: |
          git add Sources/LibrarianCore/ImageJunkScorer.swift Sources/LibrarianCore/Indexer.swift Sources/LibrarianCore/SmartOrganization.swift Tests/LibrarianTests/ImageJunkScorerTests.swift
          if git diff --cached --quiet; then
            echo 'no production patch to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: classify likely image junk conservatively"
          git push origin HEAD:feat/simple-cleaner-ui
