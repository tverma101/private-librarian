name: Repair model activation

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended
    paths:
      - .github/workflows/repair-model-activation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-does-not-work-as-intended
      - name: Patch rollback-safe model activation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {count}")
              target.write_text(text.replace(old, new, 1))

          specialist = "scripts/provision_specialist_models.py"
          specialist_anchor = '''def verify_one(name: str, require_revision: str | None = None) -> bool:\n    return _verify_snapshot(name, MODELS_ROOT / name, require_revision=require_revision)\n\n\ndef provision_one(\n'''
          specialist_replacement = '''def verify_one(name: str, require_revision: str | None = None) -> bool:\n    return _verify_snapshot(name, MODELS_ROOT / name, require_revision=require_revision)\n\n\ndef _move_path(source: Path, target: Path) -> None:\n    source.rename(target)\n\n\ndef activate_staged_snapshot(\n    staging: Path,\n    destination: Path,\n    *,\n    move=_move_path,\n) -> Path | None:\n    \"\"\"Activate a verified snapshot without ever stranding the old model.\n\n    The previous active directory is retained as the single newest recovery\n    copy. If the staging->active rename fails, the previous directory is moved\n    back immediately before the error escapes.\n    \"\"\"\n    previous_parent: Path | None = None\n    previous: Path | None = None\n    if destination.exists() or destination.is_symlink():\n        previous_parent = Path(tempfile.mkdtemp(\n            prefix=f\".{destination.name}.previous-\", dir=destination.parent))\n        previous = previous_parent / destination.name\n        move(destination, previous)\n\n    try:\n        move(staging, destination)\n    except Exception as activation_error:\n        if (\n            previous is not None\n            and (previous.exists() or previous.is_symlink())\n            and not (destination.exists() or destination.is_symlink())\n        ):\n            try:\n                move(previous, destination)\n            except Exception as restore_error:\n                raise RuntimeError(\n                    \"model activation failed and the previous checkpoint could not \"\n                    f\"be restored automatically; recover {previous} to {destination}\"\n                ) from restore_error\n        if previous_parent is not None:\n            try:\n                previous_parent.rmdir()\n            except OSError:\n                pass\n        raise activation_error\n\n    if previous_parent is not None:\n        # Model snapshots can be multi-GB. Keep one recovery generation rather\n        # than leaking another full checkpoint on every --force/update run.\n        for candidate in destination.parent.glob(f\".{destination.name}.previous-*\"):\n            if candidate == previous_parent:\n                continue\n            if candidate.is_dir() and not candidate.is_symlink():\n                shutil.rmtree(candidate, ignore_errors=True)\n    return previous_parent\n\n\ndef provision_one(\n'''
          replace_once(specialist, specialist_anchor, specialist_replacement)

          specialist_old_activation = '''        # Keep the previous checkpoint recoverable. The final rename is the\n        # only point at which the active model directory changes.\n        if dest.exists() or dest.is_symlink():\n            archive_parent = Path(tempfile.mkdtemp(prefix=f\".{name}.previous-\", dir=MODELS_ROOT))\n            dest.rename(archive_parent / name)\n        staging.rename(dest)\n'''
          specialist_new_activation = '''        # Activation is rollback-safe: a failed final rename restores the\n        # previous active checkpoint instead of leaving the app with no model.\n        previous_parent = activate_staged_snapshot(staging, dest)\n        if previous_parent is not None:\n            print(f\"  preserved previous directory at {previous_parent / name}\")\n'''
          replace_once(specialist, specialist_old_activation, specialist_new_activation)

          image = "scripts/provision_image_models.py"
          replace_once(
              image,
              '''The app itself never downloads. Use ``scripts/setup_models.sh`` to install the\nisolated local runtime and these checkpoints together. Without ``--models-dir``\n''',
              '''The app downloads only after an explicit setup action. Use\n``scripts/setup_models.sh`` to install the isolated local runtime and these\ncheckpoints together. Without ``--models-dir``\n''')

          image_archive = '''def archive_existing(destination: Path) -> Path:\n    stamp = time.strftime(\"%Y%m%d-%H%M%S\", time.localtime())\n    archive = destination.with_name(f\".{destination.name}.previous-{stamp}-{os.getpid()}\")\n    while archive.exists():\n        archive = destination.with_name(\n            f\".{destination.name}.previous-{stamp}-{os.getpid()}-{uuid.uuid4().hex[:6]}\"\n        )\n    destination.rename(archive)\n    return archive\n\n\ndef download_one(name: str, models_dir: Path, *, force: bool = False) -> bool:\n'''
          image_replacement = '''def _move_path(source: Path, target: Path) -> None:\n    source.rename(target)\n\n\ndef archive_existing(destination: Path, *, move=_move_path) -> Path:\n    stamp = time.strftime(\"%Y%m%d-%H%M%S\", time.localtime())\n    archive = destination.with_name(f\".{destination.name}.previous-{stamp}-{os.getpid()}\")\n    while archive.exists():\n        archive = destination.with_name(\n            f\".{destination.name}.previous-{stamp}-{os.getpid()}-{uuid.uuid4().hex[:6]}\"\n        )\n    move(destination, archive)\n    return archive\n\n\ndef activate_download(partial: Path, destination: Path, *, move=_move_path) -> Path | None:\n    \"\"\"Atomically activate a verified download with rollback on rename failure.\"\"\"\n    archived: Path | None = None\n    if destination.exists() or destination.is_symlink():\n        archived = archive_existing(destination, move=move)\n    try:\n        move(partial, destination)\n    except Exception as activation_error:\n        if (\n            archived is not None\n            and (archived.exists() or archived.is_symlink())\n            and not (destination.exists() or destination.is_symlink())\n        ):\n            try:\n                move(archived, destination)\n            except Exception as restore_error:\n                raise ProvisioningError(\n                    \"model activation failed and the previous checkpoint could not \"\n                    f\"be restored automatically; recover {archived} to {destination}\"\n                ) from restore_error\n        raise activation_error\n\n    if archived is not None:\n        for candidate in destination.parent.glob(f\".{destination.name}.previous-*\"):\n            if candidate == archived:\n                continue\n            if candidate.is_dir() and not candidate.is_symlink():\n                shutil.rmtree(candidate, ignore_errors=True)\n    return archived\n\n\ndef download_one(name: str, models_dir: Path, *, force: bool = False) -> bool:\n'''
          replace_once(image, image_archive, image_replacement)

          image_old_activation = '''        if destination.exists() or destination.is_symlink():\n            archived = archive_existing(destination)\n            print(f\"  preserved previous directory at {archived}\")\n        partial.rename(destination)\n        print(f\"[{name}] installed: {destination}\")\n'''
          image_new_activation = '''        archived = activate_download(partial, destination)\n        if archived is not None:\n            print(f\"  preserved previous directory at {archived}\")\n        print(f\"[{name}] installed: {destination}\")\n'''
          replace_once(image, image_old_activation, image_new_activation)

          tests = "scripts/test_specialist_contract.py"
          replace_once(
              tests,
              '''PROVISIONER = Path(__file__).with_name(\"provision_specialist_models.py\")\nMODEL = \"siglip2-so400m-naflex\"\n''',
              '''PROVISIONER = Path(__file__).with_name(\"provision_specialist_models.py\")\nIMAGE_PROVISIONER = Path(__file__).with_name(\"provision_image_models.py\")\nMODEL = \"siglip2-so400m-naflex\"\n''')

          test_anchor = '''    def test_warm_encoders_use_mps_fp16_on_apple_silicon_hosts(self) -> None:\n'''
          test_insert = '''    def test_specialist_activation_restores_previous_on_final_rename_failure(self) -> None:\n        module = load_module(PROVISIONER, \"private_librarian_specialist_activation_test\")\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            destination = root / \"model\"\n            staging = root / \"staging\"\n            destination.mkdir()\n            staging.mkdir()\n            destination.joinpath(\"marker\").write_text(\"old\")\n            staging.joinpath(\"marker\").write_text(\"new\")\n\n            def fail_final_move(source: Path, target: Path) -> None:\n                if source == staging:\n                    raise OSError(\"simulated activation failure\")\n                source.rename(target)\n\n            with self.assertRaisesRegex(OSError, \"simulated activation failure\"):\n                module.activate_staged_snapshot(staging, destination, move=fail_final_move)\n            self.assertEqual(destination.joinpath(\"marker\").read_text(), \"old\")\n            self.assertTrue(staging.is_dir())\n            self.assertEqual(list(root.glob(\".model.previous-*\")), [])\n\n    def test_specialist_activation_keeps_only_one_previous_generation(self) -> None:\n        module = load_module(PROVISIONER, \"private_librarian_specialist_retention_test\")\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            destination = root / \"model\"\n            staging = root / \"staging\"\n            destination.mkdir()\n            staging.mkdir()\n            destination.joinpath(\"marker\").write_text(\"old\")\n            staging.joinpath(\"marker\").write_text(\"new\")\n            stale = root / \".model.previous-stale\"\n            stale.mkdir()\n            stale.joinpath(\"model\").mkdir()\n\n            kept = module.activate_staged_snapshot(staging, destination)\n            self.assertEqual(destination.joinpath(\"marker\").read_text(), \"new\")\n            self.assertIsNotNone(kept)\n            self.assertFalse(stale.exists())\n            self.assertEqual(len(list(root.glob(\".model.previous-*\"))), 1)\n\n    def test_legacy_model_activation_restores_previous_on_final_rename_failure(self) -> None:\n        module = load_module(IMAGE_PROVISIONER, \"private_librarian_image_activation_test\")\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            destination = root / \"model\"\n            partial = root / \"partial\"\n            destination.mkdir()\n            partial.mkdir()\n            destination.joinpath(\"marker\").write_text(\"old\")\n            partial.joinpath(\"marker\").write_text(\"new\")\n\n            def fail_final_move(source: Path, target: Path) -> None:\n                if source == partial:\n                    raise OSError(\"simulated activation failure\")\n                source.rename(target)\n\n            with self.assertRaisesRegex(OSError, \"simulated activation failure\"):\n                module.activate_download(partial, destination, move=fail_final_move)\n            self.assertEqual(destination.joinpath(\"marker\").read_text(), \"old\")\n            self.assertTrue(partial.is_dir())\n            self.assertEqual(list(root.glob(\".model.previous-*\")), [])\n\n    def test_warm_encoders_use_mps_fp16_on_apple_silicon_hosts(self) -> None:\n'''
          replace_once(tests, test_anchor, test_insert)
          PY

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/provision_specialist_models.py scripts/provision_image_models.py
          python3 scripts/test_specialist_contract.py
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/provision_specialist_models.py scripts/provision_image_models.py scripts/test_specialist_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "Make model activation rollback-safe"
          git push origin HEAD:fix/app-does-not-work-as-intended
