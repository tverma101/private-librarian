name: Finalize simple cleaner

on:
  push:
    branches:
      - feat/simple-cleaner-ui

permissions:
  contents: write

concurrency:
  group: finalize-simple-cleaner
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-cleaner-ui
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Apply production policy
        run: python3 scripts/finalize_simple_cleaner.py

      - name: Validate source diff
        run: git diff --check

      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Swift 6 warnings-as-errors
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Model routing tests
        run: swift test --filter LocalModelRouterTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Folder explosion regressions
        run: swift test --filter FolderExplosionRegressionTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Full tests
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Package and entitlement audit
        run: |
          DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer swift build -c release
          scripts/e2e_local.sh .build/release/librarian-cli
          LIBRARIAN_BUILD_SYSTEM=swiftpm scripts/package_app.sh .build/release --no-dmg
          python3 scripts/audit_entitlements.py .build/package-stage/PrivateLibrarian.app --expect-hardened

      - name: Commit clean final state
        run: |
          git rm .github/workflows/finalize-simple-cleaner.yml scripts/finalize_simple_cleaner.py
          git add \
            .github/workflows/ci.yml \
            Sources/LibrarianCore/LocalModelRouter.swift \
            Sources/LibrarianCore/SpecialistModelBridge.swift \
            Sources/LibrarianApp/SimpleSettingsView.swift \
            Tests/LibrarianTests/LocalModelRouterTests.swift \
            docs/troubleshooting/specialist-models.md \
            scripts/provision_specialist_models.py \
            scripts/specialist.py \
            scripts/package_app.sh
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize bounded local model policy"
          git push origin HEAD:feat/simple-cleaner-ui
