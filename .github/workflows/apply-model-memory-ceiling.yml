name: Apply model memory ceiling

on:
  push:
    branches:
      - feat/simple-cleaner-ui

permissions:
  contents: write

concurrency:
  group: apply-model-memory-ceiling
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-cleaner-ui
          fetch-depth: 0

      - name: Apply exact production patch
        run: |
          if grep -q 'ling-3.0-tiny' Sources/LibrarianCore/LocalModelRouter.swift; then
            python3 scripts/apply_11_5gb_model_ceiling.py
          else
            echo 'model ceiling already applied'
          fi

      - name: Static contract
        run: |
          git diff --check
          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py
          python3 scripts/specialist.py --syntax-check
          python3 scripts/provision_specialist_models.py --list
          for model in ling-3.0-tiny internvl3.5-4b mimo-vl-7b-rl-2508; do
            if grep -R --line-number --fixed-strings "$model" \
              Sources/LibrarianCore/LocalModelRouter.swift \
              Sources/LibrarianCore/SpecialistModelBridge.swift \
              Sources/LibrarianApp/SimpleSettingsView.swift \
              scripts/provision_specialist_models.py \
              scripts/specialist.py \
              scripts/package_app.sh; then
              echo "forbidden model still exposed: $model" >&2
              exit 1
            fi
          done
          grep -F 'kwargs["torch_dtype"] = torch.float16' scripts/specialist.py

      - name: Commit production patch
        run: |
          git add \
            Sources/LibrarianCore/LocalModelRouter.swift \
            Sources/LibrarianCore/SpecialistModelBridge.swift \
            Sources/LibrarianApp/SimpleSettingsView.swift \
            Tests/LibrarianTests/LocalModelRouterTests.swift \
            scripts/provision_specialist_models.py \
            scripts/specialist.py \
            scripts/package_app.sh
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce 11.5 GB model ceiling'
          git push origin HEAD:feat/simple-cleaner-ui
