name: Repair bootstrap cancellation cleanup

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended
    paths:
      - .github/workflows/repair-bootstrap-cancel.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-does-not-work-as-intended
      - name: Patch bootstrap cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {count}")
              target.write_text(text.replace(old, new, 1))

          setup = "scripts/setup_models.sh"
          replace_once(
              setup,
              '''CURRENT_CHILD_PID=""\nCANCEL_REQUESTED=0\n''',
              '''CURRENT_CHILD_PID=""\nCANCEL_REQUESTED=0\nBOOTSTRAP_TEMP_DIR=""\n''')

          replace_once(
              setup,
              '''    else\n        # Close the tiny race between launching an asynchronous command and\n        # copying `$!` into CURRENT_CHILD_PID. Any active shell job is part of\n        # this explicit setup run, so stop and reap it before exiting.\n        for pid in $(jobs -pr); do\n            kill -TERM "$pid" 2>/dev/null || true\n        done\n        for pid in $(jobs -pr); do\n            wait "$pid" 2>/dev/null || true\n        done\n    fi\n    exit 130\n''',
              '''    else\n        # Close the tiny race between launching an asynchronous command and\n        # copying `$!` into CURRENT_CHILD_PID. Any active shell job is part of\n        # this explicit setup run, so stop and reap it before exiting.\n        for pid in $(jobs -pr); do\n            kill -TERM "$pid" 2>/dev/null || true\n        done\n        for pid in $(jobs -pr); do\n            wait "$pid" 2>/dev/null || true\n        done\n    fi\n\n    # If cancellation landed while the standalone Python archive was being\n    # downloaded or extracted, remove only the mktemp directory owned by this\n    # setup process. Never leave a half-runtime staging tree in app data.\n    if [ -n "$BOOTSTRAP_TEMP_DIR" ] && [ -d "$BOOTSTRAP_TEMP_DIR" ]; then\n        rm -rf "$BOOTSTRAP_TEMP_DIR"\n        BOOTSTRAP_TEMP_DIR=""\n    fi\n    exit 130\n''')

          replace_once(
              setup,
              '''    temp_dir="$(mktemp -d "$parent/.private-librarian-python.XXXXXX")"\n    archive="$temp_dir/$BOOTSTRAP_PYTHON_ARCHIVE"\n\n    cleanup_python_bootstrap() {\n        rm -rf "$temp_dir"\n    }\n''',
              '''    temp_dir="$(mktemp -d "$parent/.private-librarian-python.XXXXXX")"\n    BOOTSTRAP_TEMP_DIR="$temp_dir"\n    archive="$temp_dir/$BOOTSTRAP_PYTHON_ARCHIVE"\n\n    cleanup_python_bootstrap() {\n        rm -rf "$temp_dir"\n        if [ "$BOOTSTRAP_TEMP_DIR" = "$temp_dir" ]; then\n            BOOTSTRAP_TEMP_DIR=""\n        fi\n    }\n''')

          replace_once(
              setup,
              '''    mv "$temp_dir/python" "$RUNTIME_DIR"\n    echo "Installed pinned Python $BOOTSTRAP_PYTHON_VERSION runtime for Private Librarian."\n    trap - RETURN\n    rm -rf "$temp_dir"\n''',
              '''    mv "$temp_dir/python" "$RUNTIME_DIR"\n    echo "Installed pinned Python $BOOTSTRAP_PYTHON_VERSION runtime for Private Librarian."\n    BOOTSTRAP_TEMP_DIR=""\n    trap - RETURN\n    rm -rf "$temp_dir"\n''')

          ci = ".github/workflows/ci.yml"
          replace_once(
              ci,
              '''          bash -n scripts/setup_models.sh\n          bash scripts/test_setup_cancellation.sh\n          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py scripts/provision_image_models.py\n''',
              '''          bash -n scripts/setup_models.sh\n          bash scripts/test_setup_cancellation.sh\n          grep -F 'BOOTSTRAP_TEMP_DIR=""' scripts/setup_models.sh >/dev/null\n          grep -F 'rm -rf "$BOOTSTRAP_TEMP_DIR"' scripts/setup_models.sh >/dev/null\n          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py scripts/provision_image_models.py\n''')
          PY

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup_models.sh
          bash scripts/test_setup_cancellation.sh
          grep -F 'BOOTSTRAP_TEMP_DIR=""' scripts/setup_models.sh >/dev/null
          grep -F 'rm -rf "$BOOTSTRAP_TEMP_DIR"' scripts/setup_models.sh >/dev/null
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/setup_models.sh .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "Clean bootstrap staging on cancelled setup"
          git push origin HEAD:fix/app-does-not-work-as-intended
