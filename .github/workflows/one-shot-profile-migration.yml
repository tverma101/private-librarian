name: One-shot profile migration

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-does-not-work-as-intended
          fetch-depth: 0
      - name: Apply profile migration patches
        run: python3 scripts/one_shot_profile_migration.py
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/specialist.py scripts/test_specialist_contract.py \
            Sources/LibrarianCore/Indexing/Indexer.swift \
            Sources/LibrarianCore/Search/SearchService.swift \
            Sources/LibrarianApp/Library/LibrarianModel+ModelReadiness.swift \
            Sources/LibrarianApp/Library/AppEntryPoint.swift \
            Sources/LibrarianApp/App/SimpleSettingsView.swift \
            Sources/LibrarianApp/Library/ModelSetupView.swift \
            Tests/LibrarianTests/LocalModelRouterTests.swift
          git diff --cached --check
          git commit -m 'Complete profile-aware SigLIP migration'
          git push origin HEAD:fix/app-does-not-work-as-intended
