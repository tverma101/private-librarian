name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Public repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          bad_files="$(git ls-files | grep -E '(^|/)(\.env($|\.)|[^/]+\.(pem|key|p12|pfx|mobileprovision)$)' || true)"
          if [ -n "$bad_files" ]; then
            echo "Do not commit credentials or signing files:"
            echo "$bad_files"
            exit 1
          fi

          tracked_models="$(git ls-files 'Models/**' || true)"
          if [ -n "$tracked_models" ]; then
            echo "Downloaded model artifacts must stay out of git:"
            echo "$tracked_models"
            exit 1
          fi

          personal_paths="$(git grep -nE '/Users/[^/]+/' -- . ':(exclude)ThirdParty/**' ':(exclude).github/workflows/ci.yml' 2>/dev/null | grep -v '/Users/example/' || true)"
          if [ -n "$personal_paths" ]; then
            echo "Use neutral synthetic paths in public source/tests/docs:"
            echo "$personal_paths"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (debug)
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Build in Swift 6 language mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Test (mandatory security suite)
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Suite must be green
        run: grep -q "Executed .* tests, with 0 failures" test.log

      - name: Tier-2 provider contract
        run: swift test --filter Tier2IntegrationTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Local specialist runtime and memory contract
        run: |
          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py
          python3 scripts/test_specialist_contract.py
          python3 scripts/specialist.py --syntax-check | tee specialist-contract.json
          grep -q 'warm-encoders-only; transient-exclusive; disk-offload-available' specialist-contract.json
          python3 scripts/provision_specialist_models.py --list >/dev/null

      - name: Vendored SQLCipher provenance
        run: |
          test -f ThirdParty/sqlcipher/sqlite3.c
          test -f ThirdParty/sqlcipher/LICENSE_SQLCIPHER.md
          grep -q "SQLCipher 4.17.0" ThirdParty/sqlcipher/PROVENANCE.md
          grep -q "79c0e164b9c059e7487bf8f29272f601cca5f3312cc267461f81e349962a5058" ThirdParty/sqlcipher/PROVENANCE.md

  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic Golden Library quality subset
        run: |
          python3 -B scripts/benchmark_quality.py --output quality-result.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("quality-result.json").read_text())
          assert result["schema"] == 2
          required = (
              "screenshot_subtype_macro_f1",
              "screenshot_control_accuracy",
              "exact_duplicate_precision",
              "near_duplicate_recall",
              "semantic_recall_at_10",
              "cluster_purity",
              "cluster_completeness",
              "ocr_recovery",
              "ocr_latency_ms",
              "course_topic_accuracy",
              "review_precision",
              "review_coverage",
              "correction_reduction",
          )
          missing = [key for key in required if key not in result]
          assert not missing, missing
          assert result["identity"]["commit"] not in (None, "unknown")
          print("Golden Library schema and metric gate: PASS")
          PY

  entitlement-audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package sandboxed app and audit entitlements
        run: |
          DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer swift build -c release
          scripts/e2e_local.sh .build/release/librarian-cli
          scripts/package_app.sh --xcode --no-dmg
          test -x .build/package-stage/PrivateLibrarian.app/Contents/MacOS/LibrarianApp
          test ! -e .build/package-stage/PrivateLibrarian.app/Contents/MacOS/librarian-cli
          test ! -e dist/PrivateLibrarian.app
          python3 scripts/audit_entitlements.py .build/package-stage/PrivateLibrarian.app --expect-hardened
          sandbox-exec -f <(printf '(version 1)\n(allow default)\n(deny network*)\n') \
            python3 scripts/network_negative_probe.py
