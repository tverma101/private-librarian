name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: private-librarian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Public repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          bad_files="$(git ls-files | grep -E '(^|/)(\.env($|\.)|[^/]+\.(pem|key|p12|pfx|mobileprovision)$)' || true)"
          if [ -n "$bad_files" ]; then
            echo "Do not commit credentials or signing files:"
            echo "$bad_files"
            exit 1
          fi

          tracked_models="$(git ls-files 'Models/**' || true)"
          if [ -n "$tracked_models" ]; then
            echo "Downloaded model artifacts must stay out of git:"
            echo "$tracked_models"
            exit 1
          fi

          personal_paths="$(git grep -nE '/Users/[^/]+/' -- . ':(exclude)ThirdParty/**' ':(exclude).github/workflows/ci.yml' 2>/dev/null | grep -v '/Users/example/' || true)"
          if [ -n "$personal_paths" ]; then
            echo "Use neutral synthetic paths in public source/tests/docs:"
            echo "$personal_paths"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (debug)
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Build in Swift 6 language mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Test (mandatory security suite)
        shell: bash
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Suite must be green
        run: grep -q "Executed .* tests, with 0 failures" test.log

      - name: Folder explosion regression
        run: swift test --filter FolderExplosionRegressionTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Tier-2 provider contract
        run: swift test --filter Tier2IntegrationTests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Local specialist runtime, auth, and memory contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup_models.sh
          python3 -m py_compile scripts/specialist.py scripts/provision_specialist_models.py scripts/provision_image_models.py
          python3 scripts/test_specialist_contract.py
          python3 scripts/specialist.py --syntax-check | tee specialist-contract.json
          grep -q '11.50-GB-ceiling; warm-encoders-only; transient-exclusive; MPS-fp16' specialist-contract.json
          grep -F 'kwargs["torch_dtype"] = torch.float16' scripts/specialist.py
          python3 scripts/provision_specialist_models.py --list >/dev/null

          # Gated-model auth must be possible without putting an app-supplied
          # token in argv, source, UserDefaults, generated manifests, or child
          # process environment variables. setup_models.sh reads stdin once;
          # provision_specialist_models.py receives that secret on stdin too.
          grep -F -- '--hf-token-stdin' scripts/setup_models.sh >/dev/null
          grep -F -- '--hf-token-stdin' scripts/provision_specialist_models.py >/dev/null
          grep -F 'token=token' scripts/provision_specialist_models.py >/dev/null
          if grep -F 'HF_TOKEN="$HF_TOKEN_VALUE"' scripts/setup_models.sh; then
            echo "App-supplied Hugging Face token must not be exported to a child environment" >&2
            exit 1
          fi
          if git grep -nE 'hf_[A-Za-z0-9]{20,}' -- . ':(exclude)ThirdParty/**'; then
            echo "A Hugging Face token-like secret is tracked in source" >&2
            exit 1
          fi

          # Production inference stays offline even though the app now has a
          # network-client entitlement for explicit model provisioning.
          grep -F 'local_files_only=True' scripts/specialist.py >/dev/null
          grep -F 'local_files_only=True' scripts/embed.py >/dev/null
          grep -F 'HF_HUB_OFFLINE' Sources/LibrarianCore/LocalModels/SpecialistModelBridge.swift >/dev/null

          # Keep the current fp16 specialist set inside the target-Mac ceiling.
          # These candidates require a separate quantized runtime before they
          # may be exposed by production routing.
          for model in ling-3.0-tiny internvl3.5-4b mimo-vl-7b-rl-2508; do
            if grep -R --line-number --fixed-strings "$model" \
              Sources/LibrarianCore/LocalModels/LocalModelRouter.swift \
              Sources/LibrarianCore/LocalModels/SpecialistModelBridge.swift \
              Sources/LibrarianApp/App/SimpleSettingsView.swift \
              scripts/provision_specialist_models.py \
              scripts/specialist.py \
              scripts/package_app.sh; then
              echo "Model above the current fp16 target-Mac ceiling is exposed by production code: $model" >&2
              exit 1
            fi
          done

      - name: Vendored SQLCipher provenance
        run: |
          test -f ThirdParty/sqlcipher/sqlite3.c
          test -f ThirdParty/sqlcipher/LICENSE_SQLCIPHER.md
          grep -q "SQLCipher 4.17.0" ThirdParty/sqlcipher/PROVENANCE.md
          grep -q "79c0e164b9c059e7487bf8f29272f601cca5f3312cc267461f81e349962a5058" ThirdParty/sqlcipher/PROVENANCE.md

  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic Golden Library quality subset
        run: |
          python3 -B scripts/benchmark_quality.py --output quality-result.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("quality-result.json").read_text())
          assert result["schema"] == 2
          required = (
              "screenshot_subtype_macro_f1",
              "screenshot_control_accuracy",
              "exact_duplicate_precision",
              "near_duplicate_recall",
              "semantic_recall_at_10",
              "cluster_purity",
              "cluster_completeness",
              "ocr_recovery",
              "ocr_latency_ms",
              "course_topic_accuracy",
              "review_precision",
              "review_coverage",
              "correction_reduction",
          )
          missing = [key for key in required if key not in result]
          assert not missing, missing
          assert result["identity"]["commit"] not in (None, "unknown")
          print("Golden Library schema and metric gate: PASS")
          PY

  entitlement-audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package sandboxed app and audit entitlements
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer swift build -c release
          scripts/e2e_local.sh .build/release/librarian-cli
          scripts/package_app.sh --xcode --no-dmg
          test -x .build/package-stage/PrivateLibrarian.app/Contents/MacOS/LibrarianApp
          test ! -e .build/package-stage/PrivateLibrarian.app/Contents/MacOS/librarian-cli
          test ! -e dist/PrivateLibrarian.app
          python3 scripts/audit_entitlements.py .build/package-stage/PrivateLibrarian.app --expect-hardened

          # This app intentionally has outbound client networking for the
          # explicit Settings > Install Models action. The entitlement audit
          # proves server/listener capability remains absent; offline model
          # worker behavior is asserted in the test job above.
          ! codesign -d --entitlements :- .build/package-stage/PrivateLibrarian.app 2>&1 \
            | grep -q '<key>com.apple.security.network.server</key>[[:space:]]*<true/>'
