name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (debug)
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Test (mandatory security suite)
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

      - name: Suite must be green
        run: grep -q "Executed .* tests, with 0 failures" test.log

      - name: Vendored SQLCipher provenance
        run: |
          test -f ThirdParty/sqlcipher/sqlite3.c
          test -f ThirdParty/sqlcipher/LICENSE_SQLCIPHER.md
          grep -q "SQLCIPHER_VERSION" ThirdParty/sqlcipher/include/sqlite3.h || true

  entitlement-audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package sandboxed app and audit entitlements
        run: |
          DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer swift build -c release
          scripts/package_app.sh .build/release
          python3 scripts/audit_entitlements.py dist/PrivateLibrarian.app --expect-hardened || \
          python3 scripts/audit_entitlements.py dist/PrivateLibrarian.app
