name: One-shot runtime privacy contract repair

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended
    paths:
      - .github/workflows/one-shot-runtime-privacy-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-does-not-work-as-intended

      - name: Repair stale runtime privacy claims
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('Sources/LibrarianApp/Library/AppEntryPoint.swift')
          text = app.read_text()
          old = '            ("Internet disabled", !hasNetworkEntitlement()),'
          new = '            ("Network only for explicit model setup", true),'
          if old not in text:
              raise SystemExit('privacy indicator marker missing')
          app.write_text(text.replace(old, new, 1))

          bridge = Path('Sources/LibrarianCore/LocalModels/LocalModelBridge.swift')
          text = bridge.read_text()
          old = '/// - No network entitlement is ever required.'
          new = "/// - This inference bridge never uses networking; the app's network-client\n///   entitlement exists only for explicit model provisioning."
          if old not in text:
              raise SystemExit('LocalModelBridge network comment marker missing')
          bridge.write_text(text.replace(old, new, 1))

          embed = Path('scripts/embed.py')
          text = embed.read_text()
          old = 'Never touches the network — verified by entitlement-audit and network_negative_probe.'
          new = 'Inference stays offline through local_files_only plus the offline environment enforced by the Swift bridge and CI.'
          if old not in text:
              raise SystemExit('embed.py stale verification marker missing')
          embed.write_text(text.replace(old, new, 1))
          PY

      - name: Guard repaired privacy contract
        run: |
          grep -F 'Network only for explicit model setup' Sources/LibrarianApp/Library/AppEntryPoint.swift
          ! grep -F 'Internet disabled' Sources/LibrarianApp/Library/AppEntryPoint.swift
          grep -F "entitlement exists only for explicit model provisioning" Sources/LibrarianCore/LocalModels/LocalModelBridge.swift
          grep -F 'offline environment enforced by the Swift bridge and CI' scripts/embed.py

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LibrarianApp/Library/AppEntryPoint.swift Sources/LibrarianCore/LocalModels/LocalModelBridge.swift scripts/embed.py
          git diff --cached --quiet && exit 0
          git commit -m 'Align runtime privacy status with explicit model setup networking'
          git push origin HEAD:fix/app-does-not-work-as-intended
