name: One-shot Advanced Library setup parity repair

on:
  push:
    branches:
      - fix/app-does-not-work-as-intended
    paths:
      - .github/workflows/one-shot-advanced-setup-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-does-not-work-as-intended

      - name: Make Advanced Library setup resume the requested analysis
        run: |
          cat > /tmp/patch.b64 <<'B64'
          
          
          
          
          B64
          tr -d '\n' < /tmp/patch.b64 | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Guard repaired UX contract
        run: |
          grep -F 'private func requestAnalysis(_ source: LibrarianModel.SourceFolder?)' Sources/LibrarianApp/Library/LibraryViews.swift
          grep -F 'One-time setup runs here, then the exact folder choice resumes automatically.' Sources/LibrarianApp/Library/LibraryViews.swift
          ! grep -F 'Settings will show one Install & Continue action' Sources/LibrarianApp/Library/LibraryViews.swift
          grep -F 'Human-facing model setup flow contract' .github/workflows/ci.yml

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LibrarianApp/Library/LibraryViews.swift .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Resume Advanced Library analysis after model setup'
          git push origin HEAD:fix/app-does-not-work-as-intended
